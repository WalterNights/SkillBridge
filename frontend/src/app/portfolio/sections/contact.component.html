<section class="pf-contact">
  <app-pf-section-header [eyebrow]="i18n.t('contact.eyebrow')" [title]="i18n.t('contact.title')" />

  <p class="pf-contact__body">{{ i18n.t('contact.body') }}</p>

  <a class="pf-contact__cta" [href]="'mailto:' + i18n.t('contact.email')">
    <span class="pf-contact__cta-label">{{ i18n.t('contact.cta') }}</span>
    <span class="pf-contact__cta-email">{{ i18n.t('contact.email') }}</span>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/>
    </svg>
  </a>
</section>
