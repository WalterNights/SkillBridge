<aside class="pf-sidebar">
  <div class="pf-sidebar__inner">
    <!-- Identidad -->
    <header class="pf-identity">
      <p class="pf-identity__eyebrow">— PORTAFOLIO / 2026</p>
      <h1 class="pf-identity__name">Walter Nights</h1>
      <p class="pf-identity__role">{{ i18n.dict().sidebar.role }}</p>
      <p class="pf-identity__tagline">{{ i18n.dict().sidebar.tagline }}</p>
    </header>

    <!-- Nav -->
    <nav class="pf-nav" aria-label="Portfolio navigation">
      @for (item of nav; track item.id) {
        <a
          href="#{{ item.id }}"
          class="pf-nav__item"
          [class.pf-nav__item--active]="activeId() === item.id"
          (click)="onNavClick($event, item.id)"
        >
          <span class="pf-nav__line" aria-hidden="true"></span>
          <span class="pf-nav__label">{{ i18n.t(item.labelKey) }}</span>
        </a>
      }
    </nav>

    <!-- Socials + Lang -->
    <div class="pf-sidebar__footer">
      <ul class="pf-socials" aria-label="Social links">
        <li>
          <a href="https://github.com/WalterNights" target="_blank" rel="noopener noreferrer" [attr.aria-label]="i18n.dict().sidebar.socials.github">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="currentColor" d="M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.93.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.36-3.88-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.72 1.27 3.38.97.1-.75.4-1.27.73-1.56-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.18 1.18a11.06 11.06 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.58.23 2.75.11 3.04.74.81 1.18 1.84 1.18 3.1 0 4.43-2.7 5.4-5.27 5.69.41.36.77 1.06.77 2.14v3.18c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
            </svg>
          </a>
        </li>
        <li>
          <a href="https://www.linkedin.com/in/walternightsdev/" target="_blank" rel="noopener noreferrer" [attr.aria-label]="i18n.dict().sidebar.socials.linkedin">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="currentColor" d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.86 3.37-1.86 3.6 0 4.27 2.37 4.27 5.45v6.3ZM5.34 7.44a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.78C.8 0 0 .78 0 1.75v20.5C0 23.22.8 24 1.78 24h20.44c.98 0 1.78-.78 1.78-1.75V1.75C24 .78 23.2 0 22.22 0Z"/>
            </svg>
          </a>
        </li>
        <li>
          <a href="mailto:walter@geeks5g.com" [attr.aria-label]="i18n.dict().sidebar.socials.email">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 6h16v12H4z"/>
              <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m4 7 8 6 8-6"/>
            </svg>
          </a>
        </li>
      </ul>

      <div class="pf-lang" role="group" [attr.aria-label]="i18n.dict().langToggle.label">
        <button
          type="button"
          class="pf-lang__btn"
          [class.pf-lang__btn--active]="i18n.lang() === 'es'"
          (click)="setLang('es')"
        >{{ i18n.dict().langToggle.es }}</button>
        <span class="pf-lang__sep" aria-hidden="true">/</span>
        <button
          type="button"
          class="pf-lang__btn"
          [class.pf-lang__btn--active]="i18n.lang() === 'en'"
          (click)="setLang('en')"
        >{{ i18n.dict().langToggle.en }}</button>
      </div>
    </div>
  </div>
</aside>
